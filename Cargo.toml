[package]
name = "yt_descarga"
version = "0.1.0"
edition = "2021"
autobins = false

[lib]
name = "yt_descarga_lib"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ring = "0.17"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.27.2", default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }
winit = { version = "0.29", features = ["android-native-activity"] }
jni = "0.21"
ndk-context = "0.1"
android_logger = "0.13"
android-activity = { version = "0.5", features = ["native-activity"] }
libmpv-sys = { version = "3.0.1", optional = true }

[features]
mpv = ["dep:libmpv-sys"]

[package.metadata.android]
package = "com.rodrigo.yt_descarga"
build_targets = ["aarch64-linux-android"]

# Assets empaquetados en el APK.
assets = "./assets"

# Iconos y recursos Android (icono adaptable y PNG para Android < 8).
resources = "res"

# Bibliotecas nativas Android empaquetadas con el APK.
runtime_libs = "target/android-runtime-libs"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[package.metadata.android.sdk]
target_sdk_version = 33
min_sdk_version = 21

[package.metadata.android.application.activity]
label = "yt_descarga"

[package.metadata.android.application]
label = "yt_descarga"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"
# Sin esto, algunos dispositivos no extraen libytdlp.so/libffmpeg.so a disco y el "exec" falla con "No such file or directory".
extract_native_libs = true
